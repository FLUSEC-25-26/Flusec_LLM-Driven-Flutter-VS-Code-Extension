  <body>
    <h2>🛡️ Input Validation Rules</h2>
    <div style="margin-bottom: 10px;">
        <button id="addRule">➕ Add Rule</button>
        <button id="saveAll">💾 Save All Changes</button>
    </div>

    <table id="rulesTable">
      <thead>
        <tr>
          <th style="width: 150px;">ID</th>
          <th style="width: 180px;">Name</th>
          <th>Target Functions</th>
          <th style="width: 100px;">Severity</th>
          <th style="width: 140px;">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="form">
      <h3 id="formTitle">➕ Add Rule</h3>

      <label for="ruleId">Rule ID</label>
      <input id="ruleId" placeholder="e.g. FLUSEC.IVD.XSS" />

      <label for="ruleName">Rule Name</label>
      <input id="ruleName" placeholder="e.g. Cross Site Scripting" />

      <label for="targetFunctions">Target Functions (comma separated)</label>
      <input id="targetFunctions" placeholder="e.g. eval, dangerouslySetInnerHTML, exec" />
      <small style="color:#888;">List the function names that trigger this vulnerability.</small>

      <label for="ruleSeverity">Severity</label>
      <select id="ruleSeverity">
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>

      <label for="ruleDescription">Description</label>
      <textarea id="ruleDescription" placeholder="Explain why this input is dangerous..."></textarea>

      <div style="margin-top: 15px;">
          <button id="saveForm">✅ Save to List</button>
          <button id="cancelForm" style="background: #555;">❌ Cancel</button>
      </div>
    </div>

    <script>
      const vscode = acquireVsCodeApi();
      let rules = [];
      let editIndex = -1;

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (msg.command === "loadRules") {
          rules = Array.isArray(msg.rules) ? msg.rules : [];
          renderTable();
        }
      });

      function renderTable() {
        const tbody = document.querySelector("#rulesTable tbody");
        tbody.innerHTML = "";
        
        if (rules.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px; color: #888;'>No rules found. Add one to get started.</td></tr>";
            return;
        }

        for (let i = 0; i < rules.length; i++) {
          const r = rules[i];
          
          // Format target functions as tags
          let targetsHtml = "";
          if (Array.isArray(r.targetFunctions)) {
              targetsHtml = r.targetFunctions.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
          }

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${escapeHtml(r.id || "")}</td>
            <td><strong>${escapeHtml(r.name || "")}</strong></td>
            <td>${targetsHtml}</td>
            <td style="color:${getSevColor(r.severity)}">${escapeHtml((r.severity || "").toUpperCase())}</td>
            <td>
              <div class="action-cell">
                <button onclick="editRule(${i})">✏️ Edit</button>
                <button onclick="deleteInWebview(${i})" class="btn-danger">🗑️</button>
              </div>
            </td>`;
          tbody.appendChild(row);
        }
      }

      function getSevColor(sev) {
          switch(sev?.toLowerCase()) {
              case 'critical': return '#FF4444';
              case 'high': return '#FF9900';
              case 'medium': return '#CCA700';
              default: return '#ccc';
          }
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function clearForm() {
        document.getElementById("ruleId").value = "";
        document.getElementById("ruleName").value = "";
        document.getElementById("targetFunctions").value = "";
        document.getElementById("ruleSeverity").value = "medium";
        document.getElementById("ruleDescription").value = "";
        editIndex = -1;
      }

      function showForm(show) {
          document.getElementById("form").style.display = show ? "block" : "none";
          if (show) document.getElementById("form").scrollIntoView({ behavior: "smooth" });
      }

      function fillForm(r) {
        document.getElementById("ruleId").value = r.id || "";
        document.getElementById("ruleName").value = r.name || "";
        // Join array back to comma string
        document.getElementById("targetFunctions").value = Array.isArray(r.targetFunctions) ? r.targetFunctions.join(", ") : "";
        document.getElementById("ruleSeverity").value = r.severity || "medium";
        document.getElementById("ruleDescription").value = r.description || "";
      }

      function editRule(i) {
        editIndex = i;
        fillForm(rules[i]);
        document.getElementById("formTitle").textContent = "✏️ Edit Rule";
        showForm(true);
      }

      function deleteInWebview(i) {
        if (!confirm("Are you sure you want to delete this rule?")) return;
        
        const removed = rules.splice(i, 1);
        renderTable();
        // Auto-save on delete
        vscode.postMessage({
          command: "saveRules",
          rules,
          action: "delete",
          deletedId: removed?.[0]?.id || ""
        });
      }

      document.getElementById("addRule").onclick = () => {
        clearForm();
        document.getElementById("formTitle").textContent = "➕ Add Rule";
        showForm(true);
      };

      document.getElementById("cancelForm").onclick = () => {
          showForm(false);
      };

      document.getElementById("saveForm").onclick = () => {
        const id = document.getElementById("ruleId").value.trim();
        const targetsStr = document.getElementById("targetFunctions").value.trim();
        
        if (!id || !targetsStr) {
           // Simple validation
           alert("Rule ID and Target Functions are required.");
           return;
        }

        // Convert comma string to array
        const targets = targetsStr.split(",").map(s => s.trim()).filter(s => s.length > 0);

        const newRule = {
          id: id,
          name: document.getElementById("ruleName").value.trim(),
          targetFunctions: targets,
          severity: document.getElementById("ruleSeverity").value.trim(),
          description: document.getElementById("ruleDescription").value.trim(),
        };

        if (editIndex >= 0) {
          rules[editIndex] = newRule;
        } else {
          rules.push(newRule);
        }
        
        showForm(false);
        renderTable();
        // Optional: Auto-save immediately
        // vscode.postMessage({ command: "saveRules", rules });
      };

      document.getElementById("saveAll").onclick = () => {
        vscode.postMessage({ command: "saveRules", rules });
      };

      // Expose globally
      window.editRule = editRule;
      window.deleteInWebview = deleteInWebview;
    </script>
  </body>
</html> -->

<!DOCTYPE html>

    <title>IVD Dashboard</title>
    <link rel="stylesheet" href="{{cssUri}}">
    <style>
        body { background: #1e1e1e; color: #ddd; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: #252526; border-left: 5px solid #007acc; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .kpi-critical { border-left-color: #f44747; }
        .chart-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-card { background: #252526; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        canvas { width: 100% !important; height: 180px !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #252526; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #007acc; color: #4fc1ff; }
        td { padding: 10px; border-bottom: 1px solid #333; font-size: 13px; }
        .sev-critical { color: #f44747; font-weight: bold; }
        .sev-high { color: #ff9d00; font-weight: bold; }
        .empty-state { padding: 40px; text-align: center; background: #252526; border: 2px dashed #444; border-radius: 8px; margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <h1 style="color: #4fc1ff;">🛡️ IVD Security Insights</h1>
    
    <div id="dashboard-data" style="display: none;">
        <div class="kpi-row">
            <div class="kpi-card">
                <div style="font-size: 12px; color: #888; font-weight: bold; letter-spacing: 1px;">TOTAL FINDINGS</div>
                <div id="total-val" style="font-size: 38px; font-weight: bold;">0</div>
            </div>
            <div class="kpi-card kpi-critical">
                <div style="font-size: 12px; color: #888; font-weight: bold; letter-spacing: 1px;">CRITICAL VULNERABILITIES</div>
                <div id="crit-val" style="font-size: 38px; font-weight: bold; color: #f44747;">0</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-card">
                <div style="color: #4fc1ff; margin-bottom: 10px; font-weight: 600;">Findings by Rule</div>
                <canvas id="chartRules"></canvas>
            </div>
            <div class="chart-card">
                <div style="color: #4fc1ff; margin-bottom: 10px; font-weight: 600;">Top Hotspot Files</div>
                <canvas id="chartFiles"></canvas>
            </div>
        </div>
        <div id="table-content"></div>
    </div>

    <div id="empty-state" class="empty-state">
        <h2 style="color: #4fc1ff; margin-bottom: 10px;">✅ No Vulnerabilities Found (or Not Scanned Yet)</h2>
        <p>Run <strong>'FLUSEC: Scan File'</strong> via the Command Palette to analyze your Dart code.</p>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        window.addEventListener('message', e => {
            if (e.data.command === 'loadFindings') {
                render(e.data.data || []);
            }
        });

        vscode.postMessage({ command: 'ready' });

        function render(data) {
            const dataWrapper = document.getElementById('dashboard-data');
            const emptyState = document.getElementById('empty-state');

            // Handle Empty State
            if (!data || data.length === 0) {
                dataWrapper.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            // Show data
            dataWrapper.style.display = 'block';
            emptyState.style.display = 'none';

            // Update KPIs
            document.getElementById('total-val').innerText = data.length;
            document.getElementById('crit-val').innerText = data.filter(f => (f.severity || '').toLowerCase() === 'critical' || (f.severity || '').toLowerCase() === 'high').length;

            // Render Table
            let html = `<table><thead><tr><th>Severity</th><th>Rule</th><th>File</th><th>Message</th></tr></thead><tbody>`;
            data.forEach(f => {
                const sev = (f.severity || 'warning').toLowerCase();
                const rule = f.ruleId ? f.ruleId.split('.').pop() : 'Unknown';
                const file = f.file ? f.file.split(/[\\/]/).pop() : 'Unknown';
                const line = f.line || '?';
                
                html += `<tr>
                    <td class="sev-${sev}">${sev.toUpperCase()}</td>
                    <td><strong>${rule}</strong></td>
                    <td>${file}:${line}</td>
                    <td>${f.message || ''}</td>
                </tr>`;
            });
            document.getElementById('table-content').innerHTML = html + `</tbody></table>`;

            // Draw Charts
            drawBar('chartRules', aggregate(data, f => f.ruleId ? f.ruleId.split('.').pop() : 'Unknown'), '#4fc1ff');
            drawBar('chartFiles', aggregate(data, f => f.file ? f.file.split(/[\\/]/).pop() : 'Unknown'), '#cca700');
        }

        function aggregate(arr, keyFn) {
            const m = {};
            arr.forEach(x => { const k = keyFn(x); m[k] = (m[k] || 0) + 1; });
            return m;
        }

        function drawBar(id, data, color) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const keys = Object.keys(data);
            const vals = Object.values(data);
            const max = Math.max(...vals, 1);
            
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const step = canvas.width / keys.length;
            
            keys.forEach((k, i) => {
                const h = (vals[i] / max) * (canvas.height - 40);
                
                ctx.fillStyle = color;
                ctx.fillRect(i * step + 15, canvas.height - h - 25, step - 30, h);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(vals[i], (i * step) + (step / 2), canvas.height - h - 30);

                ctx.fillStyle = '#aaa';
                ctx.font = '11px Arial';
                let label = k.length > 15 ? k.substring(0, 12) + '...' : k;
                ctx.fillText(label, (i * step) + (step / 2), canvas.height - 10);
            });
        }
    </script>
</body>
</html>
