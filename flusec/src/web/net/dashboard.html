<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLUSEC · Network Security</title>
  <link rel="stylesheet" href="{{sharedCssUri}}" />
</head>
<body data-component="net">
  <header class="flusec-header">
    <div class="flusec-header__title">
      <h1>FLUSEC · Network Security</h1>
      <p>Detects insecure communication and transport configurations in Dart/Flutter code.</p>
    </div>
    <div class="flusec-header__actions">
      <button id="btnRefresh" class="flusec-button flusec-button--secondary" type="button">Refresh</button>
    </div>
  </header>

  <main class="flusec-main">
    <div class="flusec-tabs" role="tablist" aria-label="Network dashboard sections">
      <button class="flusec-tab" type="button" role="tab" aria-selected="true" aria-controls="netFindingsPanel">Security Findings</button>
      <button class="flusec-tab" type="button" role="tab" aria-selected="false" aria-controls="netCouplingPanel">Coupling</button>
    </div>

    <section id="netFindingsPanel" class="flusec-tab-panel" role="tabpanel">
      <section class="flusec-summary" aria-label="Network security finding summary">
        <div class="flusec-summary__item"><span class="flusec-summary__label">Findings</span><span class="flusec-summary__value" id="summaryTotal">0</span></div>
        <div class="flusec-summary__item" data-severity="critical"><span class="flusec-summary__label">Critical</span><span class="flusec-summary__value" id="summaryCritical">0</span></div>
        <div class="flusec-summary__item" data-severity="high"><span class="flusec-summary__label">High</span><span class="flusec-summary__value" id="summaryHigh">0</span></div>
        <div class="flusec-summary__item" data-severity="medium"><span class="flusec-summary__label">Medium</span><span class="flusec-summary__value" id="summaryMedium">0</span></div>
        <div class="flusec-summary__item" data-severity="low"><span class="flusec-summary__label">Low</span><span class="flusec-summary__value" id="summaryLow">0</span></div>
      </section>

      <section class="flusec-toolbar" aria-label="Finding filters">
        <input id="searchInput" class="flusec-input flusec-search" type="search" placeholder="Search findings, endpoints, files or CWE…" aria-label="Search findings" />
        <select id="severityFilter" class="flusec-select" aria-label="Filter by security severity">
          <option value="">All severities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="confidenceFilter" class="flusec-select" aria-label="Filter by detection confidence">
          <option value="">All confidence</option>
          <option value="high">High confidence</option>
          <option value="medium">Medium confidence</option>
          <option value="low">Low confidence</option>
        </select>
        <select id="sortFilter" class="flusec-select" aria-label="Sort findings">
          <option value="severity">Sort: Severity</option>
          <option value="confidence">Sort: Confidence</option>
          <option value="file">Sort: File</option>
          <option value="rule">Sort: Rule</option>
        </select>
        <button id="btnMoreFilters" class="flusec-button flusec-button--secondary" type="button" aria-expanded="false" aria-controls="moreFilters">More Filters</button>
      </section>

      <section id="moreFilters" class="flusec-more-filters" aria-label="Additional filters" hidden></section>
      <div id="resultCount" class="flusec-result-count" aria-live="polite">0 findings</div>
      <section id="findingsState" aria-live="polite"></section>
      <section id="findingsList" class="flusec-findings" aria-label="Network security findings"></section>
    </section>

    <section id="netCouplingPanel" class="flusec-tab-panel" role="tabpanel" hidden>
      <div id="couplingContent" aria-live="polite"></div>
    </section>
  </main>

  <script nonce="{{nonce}}" src="{{sharedJsUri}}"></script>
</body>
</html>
