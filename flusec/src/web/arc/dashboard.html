<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline';">
    <title>Architecture Dashboard</title>
    <link rel="stylesheet" href="{{cssUri}}">
    <style>
        body { background: #1e1e1e; color: #ddd; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: #252526; border-left: 5px solid #9cdcfe; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .kpi-warning { border-left-color: #cca700; }
        .chart-container { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
        .chart-card { background: #252526; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        canvas { width: 100% !important; height: 220px !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #252526; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #9cdcfe; color: #9cdcfe; }
        td { padding: 10px; border-bottom: 1px solid #333; font-size: 13px; }
        .empty-state { padding: 40px; text-align: center; background: #252526; border: 2px dashed #444; border-radius: 8px; margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <h1 style="color: #9cdcfe;">🏗️ Architecture & Cohesion Insights</h1>
    
    <div id="dashboard-data" style="display: none;">
        <div class="kpi-row">
            <div class="kpi-card">
                <div style="font-size: 12px; color: #888; font-weight: bold; letter-spacing: 1px;">LOW COHESION CLASSES</div>
                <div id="total-val" style="font-size: 38px; font-weight: bold;">0</div>
            </div>
            <div class="kpi-card kpi-warning">
                <div style="font-size: 12px; color: #888; font-weight: bold; letter-spacing: 1px;">REFACTORING PRIORITY</div>
                <div id="priority-val" style="font-size: 38px; font-weight: bold; color: #cca700;">Low</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-card">
                <div style="color: #9cdcfe; margin-bottom: 10px; font-weight: 600;">Classes Needing Refactoring</div>
                <canvas id="chartClasses"></canvas>
            </div>
        </div>
        <div id="table-content"></div>
    </div>

    <div id="empty-state" class="empty-state">
        <h2 style="color: #9cdcfe; margin-bottom: 10px;">✅ Strong Architecture</h2>
        <p>No major cohesion issues found. Your classes represent single responsibilities well.</p>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        window.addEventListener('message', e => {
            if (e.data.command === 'loadFindings') {
                render(e.data.data || []);
            }
        });

        vscode.postMessage({ command: 'ready' });

        function render(data) {
            const dataWrapper = document.getElementById('dashboard-data');
            const emptyState = document.getElementById('empty-state');

            if (!data || data.length === 0) {
                dataWrapper.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            dataWrapper.style.display = 'block';
            emptyState.style.display = 'none';

            // Update KPIs
            document.getElementById('total-val').innerText = data.length;
            document.getElementById('priority-val').innerText = data.length > 5 ? 'HIGH' : 'MEDIUM';

            // Render Table
            let html = `<table><thead><tr><th>Class Name</th><th>File</th><th>Architecture Issue</th></tr></thead><tbody>`;
            data.forEach(f => {
                const file = f.file ? f.file.split(/[\\/]/).pop() : 'Unknown';
                const line = f.line || '?';
                // We stored the class name in 'functionName' in the visitor
                const className = f.functionName || 'Unknown Class';
                
                html += `<tr>
                    <td><strong>${className}</strong></td>
                    <td>${file}:${line}</td>
                    <td>${f.message || ''}</td>
                </tr>`;
            });
            document.getElementById('table-content').innerHTML = html + `</tbody></table>`;

            // Draw Chart: Count of architectural issues per file
            drawBar('chartClasses', aggregate(data, f => f.file ? f.file.split(/[\\/]/).pop() : 'Unknown'), '#9cdcfe');
        }

        function aggregate(arr, keyFn) {
            const m = {};
            arr.forEach(x => { const k = keyFn(x); m[k] = (m[k] || 0) + 1; });
            return m;
        }

        function drawBar(id, data, color) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const keys = Object.keys(data);
            const vals = Object.values(data);
            const max = Math.max(...vals, 1);
            
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const step = canvas.width / keys.length;
            
            keys.forEach((k, i) => {
                const h = (vals[i] / max) * (canvas.height - 40);
                
                ctx.fillStyle = color;
                ctx.fillRect(i * step + 15, canvas.height - h - 25, step - 30, h);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(vals[i], (i * step) + (step / 2), canvas.height - h - 30);

                ctx.fillStyle = '#aaa';
                ctx.font = '11px Arial';
                let label = k.length > 15 ? k.substring(0, 12) + '...' : k;
                ctx.fillText(label, (i * step) + (step / 2), canvas.height - 10);
            });
        }
    </script>
</body>
</html>
